name: CI

on:
  pull_request:
  push:
    branches: [master, main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system Qt libs
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libgl1 libdbus-1-3 fonts-dejavu-core

      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -c "from sqlcipher3 import dbapi2 as s; print('sqlcipher3 OK', s.sqlite_version)"

      - name: Ruff lint
        run: ruff check src tests

      - name: Mypy type check
        run: mypy src

      - name: Dependency vulnerability scan
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit

      - name: Full test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

      - name: Acceptance tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -m acceptance -q

  deb-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            debhelper dh-python pybuild-plugin-pyproject python3-all python3-pip \
            python3-setuptools python3-pyside6.qtcore python3-pyside6.qtgui \
            python3-pyside6.qtwidgets build-essential

      - name: Build .deb package
        run: |
          chmod +x scripts/build-deb.sh
          ./scripts/build-deb.sh

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: personnel-availability-deb
          path: ../*.deb
