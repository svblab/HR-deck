[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "personnel-availability"
version = "0.1.0"
description = "Журнал доступности персонала — локальное офлайн-приложение для отдела HR"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Proprietary" }
authors = [{ name = "HR Lab" }]
dependencies = [
    "PySide6>=6.6,<7",
    "sqlcipher3>=0.6,<1",
    "argon2-cffi>=23.1,<26",
    "cryptography>=50,<51",
    "openpyxl>=3.1,<4",
    "reportlab>=4.0,<5",
    "pypdf>=6.10.2,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
personnel-availability = "ui.app:run"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["domain*", "data*", "services*", "ui*", "reports*"]

[tool.setuptools.package-data]
data = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "acceptance: traces to TZ section 11 acceptance criteria",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
warn_unused_ignores = true
disable_error_code = ["call-arg", "call-overload"]

[[tool.mypy.overrides]]
module = ["openpyxl.*", "reportlab.*", "sqlcipher3.*"]
ignore_missing_imports = true
